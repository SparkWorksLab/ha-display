# =============================================================================
# Font Configuration
# =============================================================================
#
# Defines the fonts and Material Design icon glyphs used by the e-paper display.

font:
  - file:
      type: gfonts
      family: Kode Mono
      weight: 700
    id: font_12
    size: 12
  - file:
      type: gfonts
      family: Kode Mono
      weight: 700
    id: font_16
    size: 16
  - file:
      type: gfonts
      family: Kode Mono
      weight: 700
    id: font_20
    size: 20
  - file:
      type: gfonts
      family: Kode Mono
      weight: 600
    id: font_26
    size: 26
  - file: 'fonts/materialdesigniconswebfont.ttf'
    id: weather_icons
    size: 40
    glyphs:
      - "\U000F0599" # sunny
      - "\U000F0595" # partly-cloudy
      - "\U000F0590" # cloudy
      - "\U000F0597" # rainy
      - "\U000F0596" # pouring
      - "\U000F0593" # lightning
      - "\U000F067E" # lightning-rainy
      - "\U000F0594" # clear-night
      - "\U000F0591" # fog
      - "\U000F0592" # hail
      - "\U000F059D" # windy
      - "\U000F059E" # windy-variant
      - "\U000F0F36" # snowy
      - "\U000F067F" # snowy-rainy
      - "\U000F0F2F" # exceptional

  - file: 'fonts/materialdesigniconswebfont.ttf'
    id: icon_wifi
    size: 20
    glyphs:
      - "\U000F05A9" # mdi-wifi
      - "\U000F05AA" # mdi-wifi-off
      - "\U000F16B5" # mdi-wifi-alert
      - "\U000F1B94" # mdi-bed-clock
      - "\U000F04B3" # mdi-sleep-off

  - file: 'fonts/materialdesigniconswebfont.ttf'
    id: icon_iaq
    size: 20
    glyphs:
      - "\U000F0A50" # hand-okay
      - "\U000F0513" # thumb-up
      - "\U000F0514" # thumb-up-outline
      - "\U000F0512" # thumb-down-outline
      - "\U000F0511" # thumb-down
      - "\U000F1586" # face-mask
      - "\U000F0BC6" # skull-crossbones
      - "\U000F0028" # alert-circle